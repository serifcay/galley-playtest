<style>
  :root{
    --bg-deep:#ede2c8; --bg:#f2e9d4; --panel:#f8f2e4; --panel-light:#fffcf5;
    --line:rgba(80,64,42,.14); --steel:#b6a684; --steel-light:#dcd0af;
    --bronze:#a8823f; --bronze-light:#c9a35c; --accent:#8a4a3a; --lamp:#b8863a;
    --cream:#2e2619; --muted:#85795f; --warn:#9c6440;
    --slab:'Zilla Slab', Georgia, serif; --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background: radial-gradient(120% 70% at 50% -10%, #fffaf0 0%, var(--bg-deep) 60%), var(--bg-deep);
    background-attachment: fixed;
    color:var(--cream); font-family:var(--sans); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{ font-family:inherit; }
  .app{ max-width:460px; margin:0 auto; padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px)); }
  .topbar{ display:flex; align-items:center; min-height:40px; }
  .topbar .back{ border:0; background:none; font-size:22px; color:var(--cream); cursor:pointer; padding:4px 8px 4px 0; }
  .topbar .title{ font-family:var(--slab); font-weight:700; font-size:20px; flex:1; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--panel-light); }
  .lang button{ border:0; background:none; padding:6px 11px; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; }
  .lang button.on{ background:var(--lamp); color:var(--panel-light); }
  .screen{ display:none; }
  .screen.on{ display:block; }

  /* home */
  .brand{ text-align:center; margin:36px 0 14px; white-space:nowrap; }
  .brand span{ display:inline-block; width:44px; height:51px; line-height:51px; margin:0 3px; border-radius:5px; position:relative;
    font-family:var(--slab); font-weight:700; font-size:33px; color:var(--cream); text-shadow:0 1px 0 rgba(255,255,255,.35);
    box-shadow:0 3px 6px rgba(80,64,42,.22), inset 0 1px 1px rgba(255,255,255,.45), inset 0 -5px 8px rgba(80,64,42,.14); }
  .brand span::after{ content:''; position:absolute; left:6px; right:6px; top:50%; height:1px; background:rgba(80,64,42,.18); }
  @media (max-width:380px){ .brand span{ width:38px; height:44px; line-height:44px; font-size:28px; margin:0 2px; } }
  .tagline{ text-align:center; color:var(--muted); margin:0 0 6px; }
  .testnote{ text-align:center; font-size:12px; color:var(--bronze); margin:0 0 18px; }
  .totals{ text-align:center; margin:0 0 18px; font-size:15px; }
  .totals b{ color:var(--lamp); }
  .menu{ display:flex; flex-direction:column; } .menu > * + *{ margin-top:10px; }
  .btn{ width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel-light);
    font-weight:600; font-size:15px; color:var(--cream); cursor:pointer; display:flex; align-items:center; justify-content:center; } .btn .ico{ margin-right:8px; }
  .btn:active{ transform:scale(.985); }
  .btn.primary{ background:linear-gradient(155deg, var(--lamp), var(--bronze)); color:var(--panel-light); border-color:transparent;
    padding:17px 16px; font-size:16px; box-shadow:0 6px 16px rgba(184,134,58,.28); }
  .btn.ghost{ background:transparent; }
  .btn.feedback{ border-color:var(--lamp); color:var(--bronze); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .ico{ color:var(--lamp); font-size:17px; line-height:1; }
  .btn.primary .ico{ color:inherit; }

  /* levels */
  .grid{ display:grid; grid-template-columns:repeat(5,1fr); grid-gap:9px; margin-top:8px; }
  .tile{ height:72px; border-radius:10px; border:1px solid var(--line); background:var(--panel-light);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; padding:0; color:var(--cream); } .tile small{ margin-top:3px; }
  .tile b{ font-family:var(--slab); font-size:20px; }
  .tile small{ font-size:10px; color:var(--lamp); letter-spacing:1px; }
  .tile.current{ border:1.5px solid var(--lamp); background:rgba(184,134,58,.14); }
  .tile.current b{ color:var(--lamp); }
  .tile.locked{ opacity:.4; cursor:default; }
  .tile .q{ position:absolute; top:3px; right:6px; color:var(--bronze); font-family:var(--slab); font-size:15px; }

  /* HUD */
  .hud{ display:grid; grid-template-columns:auto 1fr auto; grid-gap:14px; align-items:center;
    background:linear-gradient(180deg, var(--panel-light), var(--panel)); border:1px solid var(--line); border-radius:14px; padding:10px 14px; }
  .lbl{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px; }
  .score{ font-family:var(--slab); font-weight:700; font-size:22px; color:var(--lamp); font-variant-numeric:tabular-nums; }
  .run-bar{ height:6px; border-radius:99px; background:rgba(80,64,42,.1); overflow:hidden; }
  .run-fill{ height:100%; width:0; background:linear-gradient(90deg, var(--bronze), var(--lamp)); transition:width .25s; }
  .lbl .mult{ color:var(--lamp); font-weight:700; }
  .slips{ display:flex; } .slip + .slip{ margin-left:6px; }
  .slip{ width:14px; height:14px; border-radius:50%; background:var(--lamp); box-shadow:inset 0 -2px 3px rgba(0,0,0,.18); }
  .slip.gone{ background:transparent; border:1.5px dashed var(--line); box-shadow:none; position:relative; }
  .slip.gone::after{ content:''; position:absolute; top:1px; right:1px; bottom:1px; left:1px; border-radius:44% 56% 61% 39% / 55% 44% 56% 45%;

  .levelrow{ display:flex; justify-content:space-between; align-items:baseline; margin:10px 2px 0; }
  .levelrow .lv{ font-family:var(--slab); font-weight:700; font-size:16px; color:var(--lamp); letter-spacing:.06em; text-transform:uppercase; }

  /* press */
  .press{ position:relative; height:356px; margin:6px auto 0; max-width:300px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer; }
  .lamp-glow{ position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); width:120%; height:240px;
    background:radial-gradient(closest-side, rgba(184,134,58,.14), transparent); pointer-events:none; }
  .press:focus{ outline:none; }
  .bed{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:120px; height:14px; border-radius:4px;
    background:linear-gradient(180deg, var(--steel-light), var(--steel)); box-shadow:0 3px 10px rgba(80,64,42,.22); }
  .bed::before{ content:''; position:absolute; left:50%; bottom:100%; transform:translateX(-50%); width:96px; height:26px;
    background:radial-gradient(ellipse at center, rgba(138,74,58,.2), transparent 75%); }
  .hellbox{ position:absolute; left:6px; bottom:0; width:50px; height:50px; color:var(--steel); transition:color .15s, transform .15s;
    filter:drop-shadow(0 2px 2px rgba(46,38,25,.25)); }
  .hellbox svg{ width:50px; height:50px; display:block; }
  .hellbox.hot{ color:var(--bronze); transform:scale(1.12); transform-origin:bottom center; }
  .hellbox span{ display:none; } /* the icon says "bin" on its own */
  .uparrow{ position:absolute; left:50%; top:0; transform:translateX(-50%); font-size:18px; color:var(--lamp); opacity:0; transition:opacity .15s; }
  .uparrow.hot{ opacity:1; }
  .block{ position:absolute; left:50%; bottom:14px; width:64px; height:44px; margin-left:-32px; border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--steel-light), var(--steel) 70%);
    box-shadow:0 3px 6px rgba(80,64,42,.22), inset 0 1px 1px rgba(255,255,255,.45), inset 0 -5px 8px rgba(80,64,42,.14);
    transition:transform .26s cubic-bezier(.3,1.25,.5,1), opacity .2s; will-change:transform; }
  .block::after{ content:''; position:absolute; left:6px; right:6px; top:50%; height:1px; background:rgba(80,64,42,.18); }
  .block span{ font-family:var(--slab); font-weight:700; font-size:25px; color:var(--cream); text-shadow:0 1px 0 rgba(255,255,255,.35); position:relative; z-index:1; }
  .block.sp{ background:linear-gradient(155deg, var(--bronze-light), var(--bronze) 70%); }
  .block.sp::before{ content:'\2726'; position:absolute; top:-7px; right:-5px; font-size:12px; color:var(--lamp); text-shadow:0 0 6px rgba(184,134,58,.6); }
  .block.live{ box-shadow:0 3px 6px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.4), 0 0 0 2px var(--lamp), 0 0 14px rgba(184,134,58,.4); }
  .block.drag{ transition:none; }
  .block.out{ opacity:0; }
  .toast{ position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(.85); padding:6px 14px; border-radius:6px;
    font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;
    background:rgba(255,252,245,.97); border:1px solid var(--line); box-shadow:0 4px 14px rgba(80,64,42,.18);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:5; }
  .toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .toast.miss{ color:var(--warn); border-color:var(--warn); }
  .toast.print{ color:var(--lamp); border-color:var(--lamp); }
  .toast.hint, .toast.sp{ color:var(--bronze); border-color:var(--bronze-light); }
  .gesturehint{ text-align:center; font-size:11.5px; color:var(--muted); margin:18px 0 8px; }
  .gesturehint b{ color:var(--cream); font-weight:600; }

  /* tray */
  .tray{ background:linear-gradient(180deg, var(--panel-light), var(--panel)); border:1px solid var(--line); border-radius:16px; padding:12px 12px 12px; }
  .clue{ display:flex; align-items:baseline; margin-bottom:8px; } .clue .lbl{ margin-right:8px !important; }
  .clue .lbl{ color:var(--bronze); margin:0; flex-shrink:0; }
  .clue .txt{ font-size:14px; font-style:italic; line-height:1.4; }
  .meta{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .stick{ display:flex; flex-wrap:wrap; justify-content:center; padding:0 0 2px; border-bottom:1px dashed var(--line); min-height:52px; }
  .word{ display:flex; margin:6px 7px 10px; } .chip + .chip{ margin-left:5px; }
  .chip{ width:36px; height:38px; border-radius:5px; display:flex; align-items:center; justify-content:center;
    font-family:var(--slab); font-weight:700; font-size:18px;
    background:linear-gradient(155deg, var(--steel-light), var(--steel) 70%); box-shadow:0 2px 6px rgba(80,64,42,.2), inset 0 1px 1px rgba(255,255,255,.4); }
  .chip.small{ width:26px; height:30px; font-size:15px; }
  .chip.empty{ background:transparent; box-shadow:none; border:1.5px dashed rgba(80,64,42,.25); color:var(--muted); font-size:12px; }
  .chip.hint{ background:linear-gradient(155deg, #f2e0b4, #e6cb8f 70%); color:var(--bronze); }
  .chip.undo{ cursor:pointer; outline:1.5px solid rgba(184,134,58,.55); outline-offset:2px; }
  .chip.stamp{ animation:stamp .28s ease; }
  @keyframes stamp{ 0%{ transform:scale(1.35); filter:brightness(1.4); } 100%{ transform:scale(1); filter:none; } }
  .trayactions{ display:flex; margin-top:10px; } .trayactions .btn + .btn{ margin-left:10px; }
  .trayactions .btn{ padding:11px; font-size:14px; border-radius:9px; }
  .btn.hintbtn{ border-color:var(--bronze); color:var(--bronze); }

  /* cards */
  .overlay{ position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(60,48,30,.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:20; }
  .overlay.on{ display:flex; }
  .card{ width:100%; max-width:360px; background:linear-gradient(180deg, var(--panel-light), var(--panel)); border:1px solid var(--line);
    border-radius:16px; padding:24px 22px 16px; text-align:center; max-height:90vh; overflow:auto; }
  .eyebrow{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  .stars{ font-size:40px; letter-spacing:4px; color:var(--lamp); margin:0 0 8px; }
  .stars .off{ color:rgba(80,64,42,.18); }
  .answer{ font-family:var(--slab); font-weight:700; font-size:24px; letter-spacing:3px; margin:4px 0; }
  .answer.long{ font-size:18px; letter-spacing:1.5px; }
  .pts{ color:var(--lamp); font-weight:600; margin:0 0 16px; }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 16px; }
  .card .btn{ margin-top:8px; }
  .card .link{ background:none; border:0; color:var(--muted); font-weight:600; padding:12px; cursor:pointer; font-size:14px; }
  .adbox{ height:150px; border-radius:12px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px; color:var(--muted); margin:6px 0 10px; font-size:13px; }
  .adbox b{ font-family:var(--slab); font-size:34px; color:var(--cream); }

  /* how to / feedback */
  .panel{ background:linear-gradient(180deg, var(--panel-light), var(--panel)); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }

  .panel p, .panel li{ font-size:14px; line-height:1.5; }

  .opts{ display:flex; flex-wrap:wrap; margin:-3.5px; } .opts button{ margin:3.5px; }
  .opts button{ border:1px solid var(--line); background:var(--panel-light); padding:8px 12px; border-radius:99px; font-size:13px; cursor:pointer; color:var(--cream); }

  .opts.scale button{ width:44px; padding:8px 0; }
  .scale-ends{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; max-width:260px; }
  textarea, input[type=text]{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px;
    background:var(--panel-light); color:var(--cream); resize:vertical; }
  textarea{ min-height:70px; }
  .sechead{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--bronze); margin:22px 0 10px; font-weight:700; }
  .summary{ white-space:pre-wrap; font-size:12px; background:var(--panel-light); border:1px solid var(--line); border-radius:10px; padding:10px; max-height:220px; overflow:auto; text-align:left; font-family:ui-monospace, Menlo, monospace; }
  .done{ color:var(--lamp); font-weight:600; text-align:center; min-height:20px; margin:6px 0; font-size:13px; }
  .goal{ text-align:center; font-size:14px; margin:0 0 16px; font-weight:600; }
  .nojs{ text-align:center; padding:40px 16px; color:var(--muted); }
  .coach{ display:none; background:var(--cream); color:var(--panel-light); border-radius:12px; padding:12px 14px; margin:10px 0 0;
    font-size:14.5px; line-height:1.45; position:relative; box-shadow:0 6px 18px rgba(46,38,25,.25); }
  .coach.on{ display:block; }
  .coach{ margin:14px 0 12px; }
  .coach::after{ content:''; position:absolute; left:50%; top:-7px; margin-left:-7px; border:7px solid transparent; border-top:0; border-bottom-color:var(--cream); }
  .coach b{ color:#f2cf8a; }

  .coach .step{ font-size:11px; opacity:.7; letter-spacing:.06em; }
  .coach button{ background:var(--lamp); color:var(--panel-light); border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; }

  @keyframes nudge{ 20%{ transform:translateX(-6px); } 60%{ transform:translateX(6px); } }

  .hand.tap{ display:block; animation:handTap 1.3s ease-in-out infinite; }
  .hand.left{ display:block; animation:handLeft 1.6s ease-in-out infinite; }
  .hand.up{ display:block; animation:handUp 1.6s ease-in-out infinite; }
  @keyframes handTap{ 0%,100%{ transform:translateY(0) scale(1); } 45%{ transform:translateY(6px) scale(.86); } }
  @keyframes handLeft{ 0%{ transform:translate(0,0); opacity:0; } 15%{ opacity:1; } 70%{ transform:translate(-110px,0); opacity:1; } 100%{ transform:translate(-120px,0); opacity:0; } }

// ---------------------------------------------------------------- storage
const store = {
  get(k, d) { try { const v = localStorage.getItem('galleyDemo.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('galleyDemo.' + k, JSON.stringify(v)); } catch (e) {} },
};

let lang = store.get('lang', (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en');
const t = () => T[lang];
const upper = s => lang === 'tr' ? s.toLocaleUpperCase('tr-TR') : s.toUpperCase();

// Stats for the feedback summary.
const stats = store.get('stats', { levelsCleared: 0, fails: 0, misses: 0, sets: 0, cycles: 0, scraps: 0, freeHints: 0, adHints: 0, adSlips: 0,
  undos: 0, resets: 0, dailyTries: 0, playSeconds: 0 });
const saveStats = () => store.set('stats', stats);
let lastActive = Date.now();
function touchActive() {
  const now = Date.now();
  if (now - lastActive < 60000) stats.playSeconds += Math.round((now - lastActive) / 1000);
  lastActive = now;
}

// ---------------------------------------------------------------- audio & haptics
let audioOn = true;
function sfx(name, vol) {
  if (!audioOn || !SFX || !SFX[name]) return;
  try {
    const list = SFX[name];
    const a = new Audio(list[Math.floor(Math.random() * list.length)]);
    a.volume = vol;
    a.play().catch(() => {});
  } catch (e) {}
}
const VOL = { clack: .28, stamp: .55, printThump: .8, printRustle: .45, scrape: .6, hellbox: .5, crank: .45, coins: .45, close: .55 };
const play = (n, delay = 0) => delay ? setTimeout(() => sfx(n, VOL[n]), delay) : sfx(n, VOL[n]);
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------------------------------------------------------------- engine (ported from lib/domain/galley)
const CAPACITY = 7, START = 5, BIAS = .4, SPECIAL = .14, MAX_INK = 3, FREE_HINTS = 1, MAX_RUN = 10;
const rnd = n => Math.floor(Math.random() * n);

function scoreWord(len, run, hintsUsed, specialty) {
  const mult = 1 + run * .08;
  const base = Math.max(len * 5, len * 15 - hintsUsed * 15);
  const bonus = len >= 6 ? 40 : len >= 5 ? 20 : 0;
  return { total: Math.round((base + bonus) * mult) + (specialty ? 60 : 0), mult };
}

let G = null; // current round

function newRound(entries, opts) {
  G = { entries, idx: 0, run: opts.run || 0, ink: MAX_INK, score: 0, over: false, busy: false, refills: 0,
    galley: [], nextId: 1, mode: opts.mode, level: opts.level, bag: DATA[lang].bag.split(''),
    tut: opts.tutorial ? { i: 0, casts: [...TUTORIAL[lang].casts] } : null };
  loadWord();
  if (G.tut) G.galley = [...TUTORIAL[lang].seed].map(l => ({ id: G.nextId++, l, sp: false }));
  else seed();
}
function loadWord() {
  const e = G.entries[G.idx];
  G.target = e.w; G.clue = e.c; G.kind = e.k || 'word';
  G.slots = [...e.w].map(ch => ({ l: ch, filled: ch === ' ', hint: false }));
  G.fillOrder = []; G.hintsUsed = 0; G.specialtyUsed = false;
}
const needs = () => G.slots.filter(s => !s.filled).map(s => s.l);
const complete = () => G.slots.every(s => s.filled);
function genLetter(avoid) {
  const n = needs();
  for (let i = 0; i < 8; i++) {
    const p = n.length && Math.random() < BIAS ? n[rnd(n.length)] : G.bag[rnd(G.bag.length)];
    if (!avoid.has(p)) return p;
  }
  const s = rnd(G.bag.length);
  for (let i = 0; i < G.bag.length; i++) { const c = G.bag[(s + i) % G.bag.length]; if (!avoid.has(c)) return c; }
  return G.bag[0];
}
// The galley is a ring: no two neighbours (top and bottom included) share a letter.
function seed() {
  G.galley = [];
  for (let i = 0; i < START; i++) {
    const avoid = new Set();
    if (G.galley.length) avoid.add(G.galley[G.galley.length - 1].l);
    if (i === START - 1 && G.galley.length) avoid.add(G.galley[0].l);
    G.galley.push({ id: G.nextId++, l: genLetter(avoid), sp: false });
  }
}
function cast() {
  if (G.galley.length >= CAPACITY) return null;
  if (G.tut && G.tut.casts.length) {
    const b = { id: G.nextId++, l: G.tut.casts.shift(), sp: false };
    G.galley.push(b);
    return b;
  }
  const avoid = new Set(G.galley.length ? [G.galley[G.galley.length - 1].l, G.galley[0].l] : []);
  const b = { id: G.nextId++, l: genLetter(avoid), sp: Math.random() < SPECIAL };
  G.galley.push(b);
  return b;
}
const canAct = () => G && !G.over && !G.busy;

// During the scripted steps only the move being taught works; anything else
// nudges the coach bubble instead.
const tutStep = () => G && G.tut ? TUTORIAL[lang].steps[G.tut.i] : null;
function tutAllows(act) {
  const st = tutStep();
  if (!st) return true;
  if (st.act === act) return true;
  const c = $('coach'); c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge');
  buzz(20);
  return false;
}
function tutDone(act) {
  const st = tutStep();
  if (st && st.act === act) G.tut.i++;
}
function tutNext() {
  if (!G || !G.tut) return;
  G.tut.i++;
  if (G.tut.i >= TUTORIAL[lang].steps.length) G.tut = null;
  render();
}

function doSet() {
  if (!canAct() || !G.galley.length || complete()) return;
  if (!tutAllows('set')) return render();
  tutDone('set');
  const live = G.galley[0];
  const idxs = G.slots.map((s, i) => (!s.filled && s.l === live.l) ? i : -1).filter(i => i >= 0);
  G.galley.shift();
  stats.sets++;
  if (!idxs.length) {
    G.ink = Math.max(0, G.ink - 1); G.run = 0; stats.misses++;
    leave(live.id, 'miss');
    toast(t().noSpot, 'miss'); play('scrape'); buzz([0, 25, 15, 35]);
    if (G.ink <= 0) { G.over = true; play('close', 420); render(); setTimeout(roundOver, 700); return; }
    if (cast()) play('clack', 230);
    render(); return;
  }
  idxs.forEach(i => G.slots[i].filled = true);
  G.fillOrder.push(idxs);
  G.specialtyUsed = G.specialtyUsed || live.sp;
  leave(live.id, 'set');
  const casted = cast();
  if (complete()) { finishWord(); return; }
  play('stamp'); if (casted) play('clack', 230); buzz(12);
  if (idxs.length > 1) toast(`${live.l} ×${idxs.length}`, 'sp');
  else if (live.sp) toast(t().specialty, 'sp');
  render(idxs);
}
function doCycle() {
  if (!canAct() || !G.galley.length) return;
  if (!tutAllows('cycle')) return render();
  tutDone('cycle');
  const live = G.galley.shift(); G.galley.push(live);
  stats.cycles++;
  play('crank'); if (cast()) play('clack', 230); buzz(8);
  render();
}
function doScrap() {
  if (!canAct() || !G.galley.length) return;
  if (!tutAllows('scrap')) return render();
  tutDone('scrap');
  const live = G.galley.shift();
  stats.scraps++;
  leave(live.id, 'scrap');
  play('hellbox', 120); if (cast()) play('clack', 260); buzz(10);
  render();
}
const hintIsFree = () => G.hintsUsed < FREE_HINTS;
function doHint(rewarded) {
  if (!canAct() || complete() || tutStep()) return;
  if (!rewarded && !hintIsFree()) return;
  const blanks = G.slots.map((s, i) => s.filled ? -1 : i).filter(i => i >= 0);
  const i = blanks[rnd(blanks.length)];
  G.slots[i].filled = true; G.slots[i].hint = true;
  if (rewarded) stats.adHints++; else { G.hintsUsed++; stats.freeHints++; }
  if (complete()) { finishWord(); return; }
  play('coins'); toast(rewarded ? t().adHint : t().hintToast, 'hint');
  render([i]);
}
function doReset() {
  if (!canAct() || !G.fillOrder.length) return;
  G.fillOrder.flat().forEach(i => G.slots[i].filled = false);
  G.fillOrder = []; stats.resets++;
  render();
}
function doUndo() {
  if (!canAct() || !G.fillOrder.length) return;
  G.fillOrder.pop().forEach(i => G.slots[i].filled = false);
  stats.undos++;
  render();
}
function finishWord() {
  const letters = G.target.replace(/ /g, '').length;
  const sc = scoreWord(letters, G.run, G.hintsUsed, G.specialtyUsed);
  G.score += sc.total; G.run = Math.min(MAX_RUN, G.run + 1);
  G.lastPoints = sc.total; G.lastWord = G.target;
  G.busy = true;
  play('printThump'); play('printRustle', 90); buzz([0, 12, 40, 12, 60]);
  toast(t().printed(sc.total), 'print');
  render(G.slots.map((_, i) => i));
  setTimeout(() => {
    if (G.mode === 'daily' && G.idx < G.entries.length - 1) {
      G.idx++; loadWord(); G.busy = false; render();
    } else {
      G.over = true; G.cleared = true; roundOver();
    }
  }, 900);
}
function refill() {
  G.ink = 1; G.over = false; G.refills++; stats.adSlips++;
  if (cast()) play('clack', 200);
  play('crank'); toast(t().oneMore, 'print');
  closeCard(); render();
}

// ---------------------------------------------------------------- progress
const LEVELS = () => DATA[lang].levels.length;
function progress() {
  return store.get('progress.' + lang, { level: 1, stars: {}, score: 0, solved: [], run: 0 });
}
const saveProgress = p => store.set('progress.' + lang, p);

function pickFor(level, avoid) {
  const p = progress();
  const cands = DATA[lang].levels[level - 1].cands;
  return cands.find(c => !p.solved.includes(c.w) && c.w !== avoid)
    || cands.find(c => c.w !== avoid) || cands[0];
}
let current = { level: 1, replay: false };
function startLevel(level, avoid, forceTutorial) {
  const p = progress();
  current = { level, replay: level < p.level };
  const tutorial = level === 1 && !avoid && (forceTutorial || !store.get('tutorialDone', false));
  const e = tutorial ? { w: TUTORIAL[lang].w, c: TUTORIAL[lang].c } : pickFor(level, avoid);
  newRound([{ ...e, k: DATA[lang].levels[level - 1].kind }], { mode: 'classic', level, run: current.replay ? 0 : p.run, tutorial });
  show('game'); clearBlocks(); render();
}

// ---------------------------------------------------------------- daily
function dayKey(d = new Date()) { return d.toISOString().slice(0, 10); }
function fnv(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function dailyWords() {
  let h = fnv(dayKey() + '|' + lang);
  const next = () => (h = (Math.imul(h, 1103515245) + 12345) >>> 0);
  const pool = DATA[lang].daily;
  const used = new Set();
  return [4, 5, 5, 6, 7].map(len => {
    const list = pool[len];
    let w;
    do { w = list[next() % list.length]; } while (used.has(w.w) && used.size < list.length);
    used.add(w.w);
    return w;
  });
}
function dailyState() { return store.get('daily.' + dayKey() + '.' + lang, { tries: 0, best: 0 }); }
function startDaily() {
  const d = dailyState();
  if (d.tries >= 3) return;
  d.tries++; store.set('daily.' + dayKey() + '.' + lang, d);
  stats.dailyTries++; saveStats();
  newRound(dailyWords(), { mode: 'daily' });
  show('game'); clearBlocks(); render();
}

// ---------------------------------------------------------------- round end cards
function roundOver() {
  touchActive(); saveStats();
  if (G.mode === 'daily') return dailyOver();
  const lv = current.level;
  const p = progress();
  if (G.cleared) {
    if (lv === 1) store.set('tutorialDone', true);
    const stars = Math.max(1, Math.min(3, G.ink));
    const first = !current.replay && lv === p.level;
    p.stars[lv] = Math.max(stars, p.stars[lv] || 0);
    if (!p.solved.includes(G.lastWord)) p.solved.push(G.lastWord);
    if (first) { p.level = Math.min(lv + 1, LEVELS() + 1); p.score += G.lastPoints; p.run = G.run; stats.levelsCleared++; }
    saveProgress(p); saveStats();
    const last = lv >= LEVELS();
    showCard(`
      <p class="eyebrow">${upper(t().levelComplete(lv))}</p>
      <p class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></p>
      <p class="answer ${G.lastWord.length > 12 ? 'long' : ''}">${G.lastWord}</p>
      ${first ? `<p class="pts">${t().points(G.lastPoints)}</p>` : `<p class="sub">${t().replayNote}</p>`}
      ${last && first ? `<p class="sub">${t().allLevels}</p><button class="btn feedback" data-act="feedback">${t().giveFeedback}</button>` :
        `<button class="btn primary" data-act="${current.replay || last ? 'levels' : 'next'}">${current.replay || last ? t().backToLevels : t().next}</button>`}
      <button class="link" data-act="home">${t().home}</button>`);
  } else {
    if (!current.replay) { p.run = 0; saveProgress(p); }
    showCard(`
      <p class="eyebrow">${upper(t().failed(lv))}</p>
      <p class="sub" style="margin:0">${t().answerWas}</p>
      <p class="answer ${G.target.length > 12 ? 'long' : ''}">${G.target}</p>
      <p class="sub">${G.clue}</p>
      <button class="btn primary" data-act="retry">${t().tryAgain}</button>
      ${G.refills < 1 ? `<button class="btn" data-act="adslip">${t().oneMoreTry}</button>` : ''}
      <button class="link" data-act="home">${t().home}</button>`);
  }
}
function dailyOver() {
  const d = dailyState();
  const done = G.cleared ? 5 : G.idx;
  d.best = Math.max(d.best, G.score); store.set('daily.' + dayKey() + '.' + lang, d);
  showCard(`
    <p class="eyebrow">${upper(G.cleared ? t().dailyDone : t().dailyOut)}</p>
    <p class="answer">${t().dailyScore(G.score)}</p>
    <p class="sub">${t().wordsDone(done)} · ${t().best(d.best)}</p>
    ${!G.cleared && G.refills < 1 ? `<button class="btn" data-act="adslip">${t().oneMoreTry}</button>` : ''}
    ${d.tries < 3 ? `<button class="btn primary" data-act="daily">${t().nextTry}</button>` : `<p class="sub">${t().comeBack}</p>`}
    <button class="btn feedback" data-act="feedback">${t().seeFeedback}</button>
    <button class="link" data-act="home">${t().home}</button>`);
}
function showAd(then) {
  let n = 3;
  showCard(`<p class="eyebrow">${upper(t().adTitle)}</p><div class="adbox"><b id="adN">${n}</b><span>${t().adBody}</span></div>
    <button class="btn" id="adClose" disabled>${t().adSkip}</button>`);
  const timer = setInterval(() => {
    n--; const el = document.getElementById('adN'); if (el) el.textContent = n;
    if (n <= 0) { clearInterval(timer); const b = document.getElementById('adClose'); if (b) { b.disabled = false; b.onclick = () => { closeCard(); then(); }; } }
  }, 1000);
}
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
function showCard(html) { card.innerHTML = html; overlay.classList.add('on'); }
function closeCard() { overlay.classList.remove('on'); }
card.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'next') { closeCard(); startLevel(progress().level); }
  else if (act === 'retry') { stats.fails++; saveStats(); closeCard(); startLevel(current.level, G.target); }
  else if (act === 'adslip') { showAd(refill); }
  else if (act === 'levels') { closeCard(); show('levels'); }
  else if (act === 'home') { if (G && G.mode === 'classic' && !G.cleared && G.over) { stats.fails++; saveStats(); } closeCard(); show('home'); }
  else if (act === 'daily') { closeCard(); startDaily(); }
  else if (act === 'feedback') { closeCard(); show('feedback'); }
});

// ---------------------------------------------------------------- rendering
const $ = id => document.getElementById(id);
const blocksEl = $('blocks'), stickEl = $('stick');
const blockEls = new Map();
const STEP = 46;
function clearBlocks() { blocksEl.innerHTML = ''; blockEls.clear(); }
function leave(id, how) {
  const el = blockEls.get(id); if (!el) return;
  blockEls.delete(id);
  el.classList.remove('live', 'drag');
  const x = how === 'scrap' ? -120 : how === 'set' ? 0 : 0, y = how === 'set' ? 120 : how === 'scrap' ? 20 : 30;
  el.style.transition = 'transform .28s ease, opacity .28s ease';
  el.style.transform = how === 'miss' ? 'translateY(30px) rotate(8deg) scale(.8)' : `translate(${x + (el._dx || 0)}px, ${y}px) scale(.7)` + (how === 'scrap' ? ' rotate(-30deg)' : '');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 320);
}
function toast(text, kind) {
  const el = $('toast'); el.textContent = text; el.className = 'toast show ' + kind;
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'toast ' + kind, 900);
}
function render(stamped = []) {
  if (!G) return;
  // HUD
  $('scoreVal').textContent = G.mode === 'classic' ? progress().score : G.score;
  $('runMult').textContent = '×' + (1 + G.run * .08).toFixed(2);
  $('runFill').style.width = (G.run / MAX_RUN * 100) + '%';
  $('slipLbl').textContent = t().slipsLeft(G.ink);
  $('slips').innerHTML = [0, 1, 2].map(i => `<span class="slip ${i < G.ink ? '' : 'gone'}"></span>`).join('');
  $('levelLbl').textContent = G.mode === 'classic' ? t().level(G.level) : t().wordOf(G.idx + 1, G.entries.length);
  $('modeLbl').textContent = G.mode === 'classic' ? t().classic : t().dailyMode;
  // stack: bottom (index 0) is live
  G.galley.forEach((b, i) => {
    let el = blockEls.get(b.id);
    if (!el) {
      el = document.createElement('div'); el.className = 'block';
      el.innerHTML = `<span>${b.l}</span>`;
      el.style.transform = `translateY(${-(i + 1.6) * STEP}px)`; el.style.opacity = '0';
      blocksEl.appendChild(el); blockEls.set(b.id, el);
      void el.offsetWidth;
    }
    el.classList.toggle('sp', b.sp);
    el.classList.toggle('live', i === 0);
    el.style.zIndex = 10 - i;
    el.style.opacity = '1';
    if (!el.classList.contains('drag')) el.style.transform = `translateY(${-i * STEP}px)`;
  });
  // clue + stick
  $('clueLbl').textContent = G.kind === 'proverb' ? t().proverb : G.kind === 'idiom' ? t().idiom : t().clue;
  $('clueTxt').textContent = G.clue;
  const letters = G.target.replace(/ /g, '').length;
  $('trayMeta').textContent = t().letters(letters) + (G.hintsUsed ? t().hintsUsed(G.hintsUsed) : '');
  const small = letters > 9 || G.target.length > 12;
  const last = G.fillOrder.length ? G.fillOrder[G.fillOrder.length - 1] : [];
  let html = '', i = 0;
  for (const word of G.target.split(' ')) {
    html += '<div class="word">';
    for (const ch of word) {
      const s = G.slots[i];
      const cls = ['chip', small ? 'small' : '', !s.filled ? 'empty' : '', s.hint ? 'hint' : '', last.includes(i) && !G.busy ? 'undo' : '', stamped.includes(i) && s.filled ? 'stamp' : ''].join(' ');
      html += `<div class="${cls}" data-i="${i}">${s.filled ? ch : '·'}</div>`;
      i++;
    }
    html += '</div>';
    i++; // the space slot
  }
  stickEl.innerHTML = html;
  // buttons
  $('resetBtn').disabled = !canAct() || !G.fillOrder.length;
  const hb = $('hintBtn');
  hb.textContent = hintIsFree() ? t().hint : t().hintAd;
  hb.disabled = !canAct() || complete() || !!tutStep();
  if (tutStep()) $('resetBtn').disabled = true;
  const touch = matchMedia('(pointer: coarse)').matches;
  $('gestureHint').innerHTML = touch ? t().gesture : t().gestureDesk;
  renderCoach();
}
function renderCoach() {
  const st = tutStep(), coach = $('coach'), hand = $('hand');
  coach.classList.toggle('on', !!st);
  $('gestureHint').style.display = st ? 'none' : '';
  press.classList.toggle('teach', !!(st && st.act));
  hand.className = 'hand' + (st && st.hand ? ' ' + st.hand : '');
  if (!st) return;
  const n = TUTORIAL[lang].steps.length;
  coach.innerHTML = `${st.say}<div class="row"><span class="step">${G.tut.i + 1} / ${n}</span>${st.next ? `<button id="coachNext">${st.next}</button>` : ''}</div>`;
  if (st.hand === 'up' || st.hand === 'left') hand.style.bottom = '0px';
}
document.addEventListener('click', e => { if (e.target.id === 'coachNext') tutNext(); });
stickEl.addEventListener('click', e => { if (e.target.closest('.chip.undo')) doUndo(); });
$('resetBtn').onclick = doReset;
$('howtoBody').addEventListener('click', e => {
  if (e.target.id === 'replayTut') { store.set('tutorialDone', false); startLevel(1, undefined, true); }
});
$('hintBtn').onclick = () => { if (!canAct()) return; if (hintIsFree()) doHint(false); else showAd(() => doHint(true)); };

// ---------------------------------------------------------------- gestures
const press = $('press');
let drag = null;
press.addEventListener('pointerdown', e => {
  if (!canAct() || !G.galley.length) return;
  unlockAudio(); touchActive();
  const el = blockEls.get(G.galley[0].id); if (!el) return;
  drag = { x: e.clientX, y: e.clientY, t: performance.now(), el, dx: 0, dy: 0 };
  el.classList.add('drag');
  press.setPointerCapture(e.pointerId);
});
press.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dx = Math.min(10, e.clientX - drag.x); drag.dy = Math.min(10, e.clientY - drag.y);
  const horiz = Math.abs(drag.dx) > Math.abs(drag.dy);
  const dx = horiz ? drag.dx : drag.dx * .25, dy = horiz ? drag.dy * .25 : drag.dy;
  drag.el._dx = dx;
  drag.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 8}deg)`;
  const past = Math.hypot(drag.dx, drag.dy) > 56;
  $('hellbox').classList.toggle('hot', horiz && drag.dx < -30);
  $('upArrow').classList.toggle('hot', !horiz && drag.dy < -30);
  if (past && !drag.ticked) { drag.ticked = true; buzz(6); }
});
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  $('hellbox').classList.remove('hot'); $('upArrow').classList.remove('hot');
  const dist = Math.hypot(d.dx, d.dy), dt = performance.now() - d.t;
  const horiz = Math.abs(d.dx) > Math.abs(d.dy);
  const commit = dist > 56 || (dist > 20 && dt < 180);
  d.el.classList.remove('drag');
  if (!cancelled && commit && horiz && d.dx < 0) return doScrap();
  if (!cancelled && commit && !horiz && d.dy < 0) return doCycle();
  d.el._dx = 0;
  if (!cancelled && dist < 10) return doSet();
  render(); // spring back
}
press.addEventListener('pointerup', e => endDrag(e, false));
press.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('keydown', e => {
  if (!$('game').classList.contains('on') || overlay.classList.contains('on')) return;
  touchActive();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); unlockAudio(); doSet(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); doScrap(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); doCycle(); }
  else if (e.key.toLowerCase() === 'h') $('hintBtn').click();
});
// Browsers only allow sound after the first tap or key press; nothing to do
// beyond starting playback from inside those handlers.
function unlockAudio() {}

// ---------------------------------------------------------------- screens
let screen = 'home';
const TITLES = { home: '', levels: () => t().levels, daily: () => t().daily, game: '', howto: () => t().howto, feedback: () => t().giveFeedback };
function show(name) {
  touchActive(); saveStats();
  screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === name));
  $('backBtn').hidden = name === 'home';
  const tt = TITLES[name]; $('topTitle').textContent = typeof tt === 'function' ? tt() : '';
  if (name === 'home') renderHome();
  if (name === 'levels') renderLevels();
  if (name === 'daily') renderDaily();
  if (name === 'howto') $('howtoBody').innerHTML = t().howtoHtml;
  if (name === 'feedback') renderFeedback();
  window.scrollTo(0, 0);
}
$('backBtn').onclick = () => {
  if (screen === 'game' && G && G.mode === 'daily') return show('daily');
  if (screen === 'game' && current.replay) return show('levels');
  show('home');
};
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
$('continueBtn').onclick = () => { unlockAudio(); const p = progress(); startLevel(Math.min(p.level, LEVELS())); };

function renderHome() {
  const p = progress();
  const stars = Object.values(p.stars).reduce((a, b) => a + b, 0);
  $('totals').innerHTML = t().totals(stars, p.score);
  $('continueLbl').textContent = p.level > LEVELS() ? t().allDone : t().continueL(p.level);
}
function renderLevels() {
  const p = progress();
  $('levelGrid').innerHTML = DATA[lang].levels.map((lv, i) => {
    const n = i + 1, s = p.stars[n] || 0;
    const cls = n < p.level ? '' : n === p.level ? 'current' : 'locked';
    const mark = lv.kind !== 'word' ? '<span class="q">❝</span>' : '';
    const under = n < p.level ? `<small>${'★'.repeat(s)}${'☆'.repeat(3 - s)}</small>` : n === p.level ? '<small>▶</small>' : '<small>🔒</small>';
    return `<button class="tile ${cls}" data-lv="${n}" ${cls === 'locked' ? 'disabled' : ''}>${mark}<b>${n}</b>${under}</button>`;
  }).join('');
}
$('levelGrid').addEventListener('click', e => { const b = e.target.closest('[data-lv]'); if (b && !b.disabled) startLevel(+b.dataset.lv); });
function renderDaily() {
  const d = dailyState(), left = 3 - d.tries;
  $('dailyStatus').innerHTML = t().triesLeft(left) + (d.best ? '<br>' + t().best(d.best) : '');
  const b = $('dailyStart'); b.textContent = left > 0 ? t().startTry(d.tries + 1) : t().comeBack; b.disabled = left <= 0;
  const now = new Date(), next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1));
  const mins = Math.max(0, Math.round((next - now) / 60000));
  $('dailyReset').textContent = t().newIn(`${Math.floor(mins / 60)}h ${mins % 60}m`);
}
$('dailyStart').onclick = () => { unlockAudio(); startDaily(); };

// ---------------------------------------------------------------- feedback
let answers = store.get('answers', {});
const saveAnswers = () => store.set('answers', answers);
function renderFeedback() {
  const f = t().fb;
  const single = (key, opts) => `<div class="q"><span class="qt">${f[key]}</span><div class="opts" data-q="${key}" data-type="one">${opts.map((o, i) => `<button data-v="${i}" class="${answers[key] === i ? 'on' : ''}">${o}</button>`).join('')}</div></div>`;
  const multi = (key, opts) => `<div class="q"><span class="qt">${f[key]}</span><div class="opts" data-q="${key}" data-type="many">${opts.map((o, i) => `<button data-v="${i}" class="${(answers[key] || []).includes(i) ? 'on' : ''}">${o}</button>`).join('')}</div></div>`;
  const scale = (key, lo, hi) => `<div class="q"><span class="qt">${f[key]}</span><div class="opts scale" data-q="${key}" data-type="one">${[1, 2, 3, 4, 5].map(v => `<button data-v="${v}" class="${answers[key] === v ? 'on' : ''}">${v}</button>`).join('')}</div><div class="scale-ends"><span>1 · ${lo}</span><span>5 · ${hi}</span></div></div>`;
  const text = (key, input) => `<div class="q"><label for="fb_${key}">${f[key]}</label>${input ? `<input type="text" id="fb_${key}" data-text="${key}" value="${esc(answers[key] || '')}">` : `<textarea id="fb_${key}" data-text="${key}">${esc(answers[key] || '')}</textarea>`}</div>`;
  $('fbBody').innerHTML = `
    <div class="panel"><p style="margin:0">${f.intro}</p></div>
    <div class="sechead">${f.s1}</div>
    ${scale('fun', f.funLo, f.funHi)}${single('again', f.againO)}${text('describe')}
    <div class="sechead">${f.s2}</div>
    ${single('tutorial', f.tutorialO)}${scale('clarity', f.clarityLo, f.clarityHi)}${multi('confused', f.confusedO)}${single('feel', f.feelO)}
    <div class="sechead">${f.s3}</div>
    ${single('clues', f.cluesO)}${single('curve', f.curveO)}${single('slips3', f.slips3O)}${text('badClue')}
    <div class="sechead">${f.s4}</div>
    ${single('cycleCost', f.cycleCostO)}${single('hintFair', f.hintFairO)}${single('adsOk', f.adsOkO)}${multi('modes', f.modesO)}${single('daily', f.dailyO)}${text('idea')}
    <div class="sechead">${f.s5}</div>
    ${text('other')}${text('name', true)}
    <button class="btn primary" id="fbBuild">${f.build}</button>
    <div id="fbOut"></div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('fbBody').addEventListener('click', e => {
  const b = e.target.closest('.opts button');
  if (b) {
    const box = b.parentElement, key = box.dataset.q, v = +b.dataset.v;
    if (box.dataset.type === 'one') {
      answers[key] = answers[key] === v ? undefined : v;
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.v === answers[key]));
    } else {
      const set = new Set(answers[key] || []); set.has(v) ? set.delete(v) : set.add(v); answers[key] = [...set].sort();
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', set.has(+x.dataset.v)));
    }
    saveAnswers(); return;
  }
  if (e.target.id === 'fbBuild') buildSummary();
  if (e.target.id === 'fbCopy') copySummary();
  if (e.target.id === 'fbShare') shareSummary();
});
$('fbBody').addEventListener('input', e => { const k = e.target.dataset.text; if (k) { answers[k] = e.target.value; saveAnswers(); } });

function summaryText() {
  touchActive(); saveStats();
  const f = t().fb, en = T.en.fb;
  const lines = [`${f.summaryHead} · ${dayKey()} · ${lang.toUpperCase()}`, ''];
  const pick = (key, opts) => answers[key] === undefined ? '—' : opts[answers[key]];
  const many = (key, opts) => (answers[key] || []).map(i => opts[i]).join('; ') || '—';
  const add = (q, a) => lines.push(`• ${q}\n  ${a}`);
  add(f.fun, answers.fun ? `${answers.fun}/5` : '—');
  add(f.again, pick('again', f.againO));
  add(f.describe, answers.describe || '—');
  add(f.tutorial, pick('tutorial', f.tutorialO));
  add(f.clarity, answers.clarity ? `${answers.clarity}/5` : '—');
  add(f.confused, many('confused', f.confusedO));
  add(f.feel, pick('feel', f.feelO));
  add(f.clues, pick('clues', f.cluesO));
  add(f.curve, pick('curve', f.curveO));
  add(f.slips3, pick('slips3', f.slips3O));
  add(f.badClue, answers.badClue || '—');
  add(f.cycleCost, pick('cycleCost', f.cycleCostO));
  add(f.hintFair, pick('hintFair', f.hintFairO));
  add(f.adsOk, pick('adsOk', f.adsOkO));
  add(f.modes, many('modes', f.modesO));
  add(f.daily, pick('daily', f.dailyO));
  add(f.idea, answers.idea || '—');
  add(f.other, answers.other || '—');
  if (answers.name) lines.push('', `— ${answers.name}`);
  const pe = store.get('progress.en', null), pt = store.get('progress.tr', null);
  const lv = p => p ? `L${Math.min(p.level, LEVELS())}${p.level > LEVELS() ? '✓' : ''}` : '–';
  lines.push('', `[stats] EN ${lv(pe)} · TR ${lv(pt)} · cleared ${stats.levelsCleared} · failed ${stats.fails} · misses ${stats.misses}/${stats.sets} sets · cycles ${stats.cycles} · scraps ${stats.scraps} · hints ${stats.freeHints} free + ${stats.adHints} ad · extra slips ${stats.adSlips} · undo ${stats.undos} · reset ${stats.resets} · daily tries ${stats.dailyTries} · ${Math.round(stats.playSeconds / 60)} min · ${matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse'}`);
  return lines.join('\n');
}
function buildSummary() {
  const f = t().fb;
  const txt = summaryText();
  $('fbOut').innerHTML = `<div class="summary" id="fbText">${esc(txt)}</div>
    <div class="done" id="fbDone"></div>
    <button class="btn primary" id="fbCopy">${f.copy}</button>
    ${navigator.share ? `<button class="btn" id="fbShare" style="margin-top:8px">${f.share}</button>` : ''}`;
  $('fbOut').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function copySummary() {
  const txt = summaryText();
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($('fbText'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); } catch (x) {}
  }
  $('fbDone').textContent = t().fb.copied;
}
async function shareSummary() {
  try { await navigator.share({ title: 'Littera feedback', text: summaryText() }); $('fbDone').textContent = t().fb.shared; } catch (e) {}
}

// ---------------------------------------------------------------- language
function setLang(l) {
  lang = l; store.set('lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  document.querySelectorAll('[data-t]').forEach(el => { const v = t()[el.dataset.t]; if (typeof v === 'string') el.textContent = v; });
  if (screen === 'game') { G = null; clearBlocks(); closeCard(); show('home'); }
  else show(screen);
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.addEventListener('visibilitychange', () => { touchActive(); saveStats(); });
document.getElementById('nojs').style.display = 'none';
setLang(lang);
</script>
